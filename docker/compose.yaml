services:
  app:
    image: derikjl/retronap:0.0.1-alpha
    pull_policy: never
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RETRONAP_FILE_DATABASE: /var/lib/retronap/retronap
      RETRONAP_FILE_DATABASE_USERNAME: ${RETRONAP_FILE_DATABASE_USERNAME:-sa}
      RETRONAP_FILE_DATABASE_PASSWORD: ${RETRONAP_FILE_DATABASE_PASSWORD:-}
      RETRONAP_METASERVER_SERVERLIST: 127.0.0.1:8888
      BPL_JVM_THREAD_COUNT: 50
    volumes:
      - type: bind
        source: ../data
        target: /var/lib/retronap
        bind:
          create_host_path: false
    ports:
      - "8888:8888"
      - "8875:8875"
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: '0.50'
          memory: 512M

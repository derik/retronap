spring:
  application:
    name: retronap
    version: 0.1.0-SNAPSHOT
  main:
    web-application-type: none
  datasource:
    # Database basename; H2 adds the .mv.db extension.
    url: jdbc:h2:file:${RETRONAP_FILE_DATABASE:./data/retronap}
    driver-class-name: org.h2.Driver
    username: ${RETRONAP_FILE_DATABASE_USERNAME:sa}
    password: ${RETRONAP_FILE_DATABASE_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate.ddl-auto: validate
    show-sql: false
  jmx:
    enabled: false

logging:
  level:
    com.deriklima.retronap: INFO

retronap:
  server:
    enabled: true
    port: 8888
    max-connections: 5000
    session-timeout: 600
  metaserver:
    enabled: true
    port: 8875
    # If the clients are running on other machines or VMs
    # the IP must be the one in the local network
    server-list: 127.0.0.1:8888
  path-config:
    motd: configs/motd.txt
    channels: configs/channels.txt
